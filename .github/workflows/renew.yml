name: Auto Renew Bot-hosting

on:
  schedule:
    - cron: '30 22 * * *' # 每天UTC 1点 (北京时间9点)
  workflow_dispatch:

jobs:
  Renew-bot:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    
    # 1. 在这里静态映射多个账号的密钥（目前配置了 2 个账号，可按需扩展）
    env:
      # --- 账号 1 配置 ---
      ACC1_EMAIL: ${{ secrets.EMAIL_1 }}
      ACC1_PASSWORD: ${{ secrets.PASSWORD_1 }}
      ACC1_NODE: ${{ secrets.NODE_LINK_1 }}

      # --- 账号 2 配置 ---
      ACC2_EMAIL: ${{ secrets.EMAIL_2 }}
      ACC2_PASSWORD: ${{ secrets.PASSWORD_2 }}
      ACC2_NODE: ${{ secrets.NODE_LINK_2 }}

      # --- 通用通知配置 ---
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖（只需安装一次）
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: 🚀 循环串行执行多账号保活
        run: |
          # 定义要依次处理的账号编号列表（这里有 2 个：1 和 2）
          # 如果以后有第 3 个账号，只需改成 "1 2 3" 即可
          ACCOUNTS="1 2"

          for i in $ACCOUNTS; do
            # 利用 bash 间接寻址动态获取对应编号的账号配置
            eval email=\$ACC${i}_EMAIL
            eval password=\$ACC${i}_PASSWORD
            eval node_link=\$ACC${i}_NODE

            # 如果邮箱为空（说明没配置这个账号），则跳过
            if [ -z "$email" ]; then
              echo "账号 $i 未配置或邮箱为空，跳过..."
              continue
            fi

            echo "=================================================="
            echo "🚀 开始处理第 $i 个账号: $email"
            echo "=================================================="

            # 1. 设置当前账号的代理 (sing-box)
            if [ -n "$node_link" ]; then
              echo "⚙ 正在为账号 $i 配置专属代理..."
              export NODE_LINK="$node_link"
              bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
            else
              echo "⚠️ 账号 $i 未配置代理节点，将直接联网..."
            fi

            # 2. 运行续期脚本
            export EMAIL="$email"
            export PASSWORD="$password"
            
            echo "▶ 正在运行 Python 续期脚本..."
            xvfb-run --auto-servernum python3 app.py || echo "⚠️ 账号 $i 运行过程中出现错误，继续执行下一个..."

            # 3. 清理当前账号的代理进程和浏览器残留，防止影响下一个账号
            echo "🧹 清理当前账号的临时进程和代理文件..."
            pkill -f sing-box || true
            pkill -f chromedriver || true
            pkill -f chrome || true
            pkill -f Xvfb || true
            rm -f sing-box sing-box-config.json sing-box.log

            # 4. 账号之间暂停 30 秒，避免请求过于密集触发面板/Cloudflare 风控
            echo "⏳ 暂停 30 秒后处理下一个账号..."
            sleep 30
          done

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ -z "$run_id" ]; then continue; fi
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
