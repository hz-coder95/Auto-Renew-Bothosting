name: Auto Renew Bot-hosting

on:
  schedule:
    - cron: '30 22 * * *' # 每天UTC 1点 (北京时间9点)
  workflow_dispatch:

jobs:
  Renew-bot:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    
    # 多账号配置与邮件配置
    env:
      # --- 账号 1 配置 ---
      ACC1_EMAIL: ${{ secrets.EMAIL_1 }}
      ACC1_PASSWORD: ${{ secrets.PASSWORD_1 }}
      ACC1_NODE: ${{ secrets.NODE_LINK_1 }}

      # --- 账号 2 配置 ---
      ACC2_EMAIL: ${{ secrets.EMAIL_2 }}
      ACC2_PASSWORD: ${{ secrets.PASSWORD_2 }}
      ACC2_NODE: ${{ secrets.NODE_LINK_2 }}

      # --- 邮件通知配置 ---
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - uses: actions/checkout@v4

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: 🚀 循环串行执行多账号保活
        run: |
          ACCOUNTS="1 2"

          for i in $ACCOUNTS; do
            eval email=\$ACC${i}_EMAIL
            eval password=\$ACC${i}_PASSWORD
            eval node_link=\$ACC${i}_NODE

            if [ -z "$email" ]; then
              echo "账号 $i 未配置或邮箱为空，跳过..."
              continue
            fi

            echo "=================================================="
            echo "🚀 开始处理第 $i 个账号: $email"
            echo "=================================================="

            if [ -n "$node_link" ]; then
              echo "⚙ 正在为账号 $i 配置专属代理..."
              export NODE_LINK="$node_link"
              bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
            else
              echo "⚠️ 账号 $i 未配置代理节点，将直接联网..."
            fi

            export EMAIL="$email"
            export PASSWORD="$password"
            
            echo "▶ 正在运行 Python 续期脚本..."
            xvfb-run --auto-servernum python3 app.py || echo "⚠️ 账号 $i 运行过程中出现错误，继续执行下一个..."

            echo "🧹 清理当前账号的临时进程和代理文件..."
            pkill -f sing-box || true
            pkill -f chromedriver || true
            pkill -f chrome || true
            pkill -f Xvfb || true
            rm -f sing-box sing-box-config.json sing-box.log

            echo "⏳ 暂停 30 秒后处理下一个账号..."
            sleep 30
          done

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      # --- 新增：发送邮件通知步骤 ---
      - name: 📧 发送执行结果邮件通知
        if: always() # 无论成功或失败都会发送邮件
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com       # 如果是163邮箱，请改为 smtp.163.com；Gmail改为 smtp.gmail.com
          server_port: 465                  # SSL加密端口，一般QQ/163选465
          secure: true                      # 启用TLS/SSL
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "【Bot-Hosting】保活任务执行报告 (${{ job.status }})"
          body: |
            你好！
            你的 Bot-Hosting 多账号保活任务已执行完毕。
            
            本次运行状态: ${{ job.status }}
            仓库名称: ${{ github.repository }}
            触发方式: ${{ github.event_name }}
            
            请登录 GitHub 仓库查看具体的 Actions 运行日志。
          to: ${{ secrets.MAIL_TO }}
          from: Bot-Hosting Watcher <${{ secrets.MAIL_USERNAME }}>

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ -z "$run_id" ]; then continue; fi
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
