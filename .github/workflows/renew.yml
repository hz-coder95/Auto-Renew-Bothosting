name: Auto Renew Bot-hosting

on:
  schedule:
    - cron: '30 22 * * *' # 每天UTC 1点 (北京时间9点)
  workflow_dispatch:

jobs:
  Renew-bot:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    
    # 静态映射多账号密钥与新浪邮箱通知配置（默认支持到 3 个账号，可按需增减）
    env:
      # --- 账号 1 配置 ---
      ACC1_EMAIL: ${{ secrets.EMAIL_1 }}
      ACC1_PASSWORD: ${{ secrets.PASSWORD_1 }}
      ACC1_NODE: ${{ secrets.NODE_LINK_1 }}

      # --- 账号 2 配置 ---
      ACC2_EMAIL: ${{ secrets.EMAIL_2 }}
      ACC2_PASSWORD: ${{ secrets.PASSWORD_2 }}
      ACC2_NODE: ${{ secrets.NODE_LINK_2 }}

      # --- 账号 3 配置 ---
      ACC3_EMAIL: ${{ secrets.EMAIL_3 }}
      ACC3_PASSWORD: ${{ secrets.PASSWORD_3 }}
      ACC3_NODE: ${{ secrets.NODE_LINK_3 }}

      # --- 新浪邮箱通知配置 ---
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - uses: actions/checkout@v4

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖（只需安装一次）
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: 🚀 循环串行执行多账号保活并记录三种状态
        run: |
          # 初始化邮件报告临时文件
          echo "你好！以下是本次 Bot-Hosting 多账号保活的执行明细：" > report.txt
          echo "----------------------------------------" >> report.txt

          # 定义要依次处理的账号编号列表（当前检测 1、2、3 号账号）
          ACCOUNTS="1 2 3"

          for i in $ACCOUNTS; do
            # 动态获取对应编号的账号配置
            eval email=\$ACC${i}_EMAIL
            eval password=\$ACC${i}_PASSWORD
            eval node_link=\$ACC${i}_NODE

            # 如果邮箱为空，说明未配置该账号，记录为“跳过”状态并继续下一个
            if [ -z "$email" ]; then
              echo "账号 $i 未配置或邮箱为空，跳过..."
              echo "账号槽位: 账号 $i (未配置)" >> report.txt
              echo "状态: 跳过 (Skipped) ⏭️" >> report.txt
              echo "----------------------------------------" >> report.txt
              continue
            fi

            echo "=================================================="
            echo "🚀 开始处理第 $i 个账号: $email"
            echo "=================================================="

            # 1. 设置当前账号的专属代理 (sing-box)
            if [ -n "$node_link" ]; then
              echo "⚙ 正在为账号 $i 配置专属代理..."
              export NODE_LINK="$node_link"
              bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
            else
              echo "⚠️ 账号 $i 未配置代理节点，将直接联网..."
            fi

            # 2. 运行续期脚本并捕获执行状态（成功/失败）
            export EMAIL="$email"
            export PASSWORD="$password"
            
            echo "▶ 正在运行 Python 续期脚本..."
            
            if xvfb-run --auto-servernum python3 app.py; then
              account_status="成功 (Success) ✅"
              echo "✅ 账号 $i ($email) 保活成功"
            else
              account_status="失败 (Failed) ❌"
              echo "❌ 账号 $i ($email) 保活失败"
            fi

            # 将当前账号的执行结果写入报告文件
            echo "账号: $email" >> report.txt
            echo "状态: $account_status" >> report.txt
            echo "----------------------------------------" >> report.txt

            # 3. 清理当前账号的代理进程和浏览器残留，防止影响下一个账号
            echo "🧹 清理当前账号的临时进程和代理文件..."
            pkill -f sing-box || true
            pkill -f chromedriver || true
            pkill -f chrome || true
            pkill -f Xvfb || true
            rm -f sing-box sing-box-config.json sing-box.log

            # 4. 账号之间暂停 30 秒，避免请求过于密集触发风控
            echo "⏳ 暂停 30 秒后处理下一个账号..."
            sleep 30
          done

          # 将报告文件的内容读取并写入 GitHub 环境变量供后续邮件使用
          {
            echo "MAIL_CONTENT<<EOF"
            cat report.txt
            echo "EOF"
          } >> $GITHUB_ENV

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 📧 发送包含三种状态明细的新浪邮箱通知
        if: always() # 无论成功或失败都会发送邮件
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.sina.com     # 新浪邮箱服务器地址
          server_port: 465                  # SSL 加密端口
          secure: true                      # 启用 SSL
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "【Bot-Hosting】多账号保活任务执行报告 (${{ job.status }})"
          body: ${{ env.MAIL_CONTENT }}     # 使用包含成功/失败/跳过的动态明细
          to: ${{ secrets.MAIL_TO }}
          from: Bot-Hosting Watcher <${{ secrets.MAIL_USERNAME }}>

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ -z "$run_id" ]; then continue; fi
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
